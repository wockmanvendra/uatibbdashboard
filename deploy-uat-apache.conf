# IBB Insights (sales dashboard) - UAT
# /etc/apache2/sites-available/uatibbinsights.conf
#
# Serves the frontend from /var/www/ibb-insights/web and forwards /api to the
# API (PM2 app "ibb-insights-api") on 127.0.0.1:8787. Only this host name is
# matched, so the other sites on the server are not affected.
#
# Needs: a2enmod proxy proxy_http headers rewrite   (and ssl for the HTTPS block)
# If 8787 is taken on this server, change it here AND in the API's .env (PORT).

<VirtualHost *:80>
    ServerName uatIbbInsights.wockhardt.com

    DocumentRoot /var/www/ibb-insights/web
    <Directory /var/www/ibb-insights/web>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # Any path that is not a file (/division, /login/bu-head, ...) gets the app.
        FallbackResource /index.html
    </Directory>

    # The API. Dashboard queries read the warehouse directly and can take
    # 30-60 s, so the proxy waits up to 5 minutes.
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 300
    ProxyPass        /api/ http://127.0.0.1:8787/api/ retry=0 timeout=300
    ProxyPassReverse /api/ http://127.0.0.1:8787/api/
    RequestHeader set X-Forwarded-Proto "http"

    # Hashed build files never change; index.html must always be re-read.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <LocationMatch "^/(index\.html)?$">
        Header set Cache-Control "no-cache"
    </LocationMatch>
    AddType font/woff2 .woff2

    ErrorLog ${APACHE_LOG_DIR}/ibb-insights-error.log
    CustomLog ${APACHE_LOG_DIR}/ibb-insights-access.log combined
</VirtualHost>

# HTTPS: if the site has a certificate on this server, uncomment this block,
# set the certificate paths, and (optionally) redirect port 80 to it by adding
#     Redirect permanent / https://uatIbbInsights.wockhardt.com/
# to the block above in place of its content.
